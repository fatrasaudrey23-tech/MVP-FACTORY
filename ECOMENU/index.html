<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMenu - Dashboard Universel MVP</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen" x-data="mvpDashboard()">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-sm">⚙️</div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900">EcoMenu</h1>
                    <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Console de Contrôle MVP</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 text-xs">
                <span :class="apiOnline ? 'bg-emerald-500' : 'bg-rose-500'" class="w-2 h-2 rounded-full animate-pulse"></span>
                <span class="font-medium text-slate-600" x-text="apiOnline ? 'API Connectée (Port 8001)' : 'API Déconnectée'">Vérification...</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <nav class="flex space-x-2 border-b border-slate-200 pb-px overflow-x-auto">
            <template x-for="table in tables" :key="table">
                <button 
                    @click="changeTable(table)"
                    :class="activeTable === table ? 'border-indigo-600 text-indigo-600 bg-white shadow-xs font-semibold' : 'border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-100'"
                    class="whitespace-nowrap py-2.5 px-4 text-sm border-b-2 rounded-t-lg transition duration-150 cursor-pointer"
                    x-text="formatTableName(table)">
                </button>
            </template>
        </nav>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            
            <section class="bg-white border border-slate-200 rounded-xl p-5 shadow-xs space-y-4">
                <div class="border-b border-slate-100 pb-2">
                    <h2 class="font-bold text-slate-900 text-sm tracking-tight flex items-center space-x-1.5">
                        <span>📥 Ingestion :</span>
                        <span class="text-indigo-600" x-text="formatTableName(activeTable)"></span>
                    </h2>
                    <p class="text-xs text-slate-400 mt-0.5">Génération de champs par introspection du schéma.</p>
                </div>

                <form @submit.prevent="submitForm()" class="space-y-4">
                    <template x-for="champ in formulairesConfig[activeTable]" :key="champ.name">
                        <div class="space-y-1">
                            <label :for="champ.name" class="block text-xs font-semibold text-slate-600" x-text="champ.label"></label>
                            
                            <template x-if="champ.type === 'BOOLEAN'">
                                <select :id="champ.name" x-model="formData[champ.name]" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm w-full focus:outline-indigo-500">
                                    <option value="true">Oui / Vrai</option>
                                    <option value="false">Non / Faux</option>
                                </select>
                            </template>

                            <template x-if="['INTEGER', 'FLOAT'].includes(champ.type)">
                                <input type="number" :step="champ.type === 'FLOAT' ? '0.01' : '1'" :id="champ.name" x-model="formData[champ.name]" class="border border-slate-300 rounded-lg px-3 py-2 text-sm w-full focus:outline-indigo-500" required>
                            </template>

                            <template x-if="['VARCHAR', 'TEXT', 'UUID', 'TIMESTAMP'].includes(champ.type)">
                                <input :type="champ.name.includes('date') ? 'date' : 'text'" :id="champ.name" x-model="formData[champ.name]" class="border border-slate-300 rounded-lg px-3 py-2 text-sm w-full focus:outline-indigo-500" required>
                            </template>
                        </div>
                    </template>

                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition shadow-xs w-full cursor-pointer">
                        Ajouter à la table <span x-text="activeTable"></span>
                    </button>
                </form>
            </section>

            <section class="lg:col-span-2 bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden">
                <div class="p-5 border-b border-slate-200 flex items-center justify-between bg-slate-50/50">
                    <div>
                        <h2 class="font-bold text-slate-900 text-base tracking-tight">Registre des Données</h2>
                        <p class="text-xs text-slate-400" x-text="'Flux live depuis /api/v1/' + activeTable"></p>
                    </div>
                    <button @click="loadData()" class="text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg border border-indigo-100 transition cursor-pointer">
                        Rafraîchir 🔄
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-200 text-sm text-left">
                        <thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            <tr>
                                <template x-for="champ in formulairesConfig[activeTable]" :key="champ.name">
                                    <th scope="col" class="px-6 py-3" x-text="champ.label"></th>
                                </template>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200 bg-white">
                            <template x-for="(row, idx) in tableData" :key="idx">
                                <tr class="hover:bg-slate-50/80 transition">
                                    <template x-for="champ in formulairesConfig[activeTable]" :key="champ.name">
                                        <td class="px-6 py-3.5 whitespace-nowrap text-slate-700 font-medium">
                                            <span x-text="row[champ.name] === true ? '✅ Oui' : (row[champ.name] === false ? '❌ Non' : row[champ.name] || '-')"></span>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                            
                            <template x-if="tableData.length === 0">
                                <tr>
                                    <td :colspan="formulairesConfig[activeTable]?.length || 1" class="px-6 py-10 text-center text-slate-400 italic">
                                        Aucune donnée trouvée dans cette table. Utilisez le panneau d'ingestion pour créer un enregistrement !
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script>
        function mvpDashboard() {
            return {
                apiOnline: false,
                tables: ["users", "enseigne_selection", "promotions", "produit_tags", "menus"],
                activeTable: 'users',
                formulairesConfig: {"users": [{"name": "budget_max", "type": "FLOAT", "label": "Budget max"}, {"name": "taille_foyer", "type": "INTEGER", "label": "Taille foyer"}, {"name": "gestion_restes", "type": "BOOLEAN", "label": "Gestion restes"}, {"name": "type_boite_lunch", "type": "TEXT", "label": "Type boite lunch"}, {"name": "profil_boite_lunch", "type": "TEXT", "label": "Profil boite lunch"}], "enseigne_selection": [{"name": "user_id", "type": "UUID", "label": "User id"}, {"name": "enseigne", "type": "TEXT", "label": "Enseigne"}], "promotions": [{"name": "enseigne", "type": "TEXT", "label": "Enseigne"}, {"name": "nom_produit", "type": "TEXT", "label": "Nom produit"}, {"name": "prix_promo", "type": "FLOAT", "label": "Prix promo"}, {"name": "poids_volume", "type": "TEXT", "label": "Poids volume"}, {"name": "unite_mesure", "type": "TEXT", "label": "Unite mesure"}, {"name": "categorie_alimentaire", "type": "TEXT", "label": "Categorie alimentaire"}], "produit_tags": [{"name": "nom_produit", "type": "TEXT", "label": "Nom produit"}, {"name": "tag_standard", "type": "TEXT", "label": "Tag standard"}], "menus": [{"name": "user_id", "type": "UUID", "label": "User id"}, {"name": "menu_data", "type": "JSONB", "label": "Menu data"}, {"name": "date_generation", "type": "TIMESTAMP", "label": "Date generation"}]},
                tableData: [],
                formData: {},

                init() {
                    this.verifierAPI();
                    this.resetFormData();
                    this.loadData();
                    // Re-vérification cyclique du serveur
                    setInterval(() => this.verifierAPI(), 5000);
                },

                formatTableName(name) {
                    return name.replace('_', ' ').toUpperCase();
                },

                async verifierAPI() {
                    try {
                        const res = await fetch("http://127.0.0.1:8001/");
                        this.apiOnline = res.ok;
                    } catch (e) {
                        this.apiOnline = false;
                    }
                },

                changeTable(table) {
                    this.activeTable = table;
                    this.resetFormData();
                    this.loadData();
                },

                resetFormData() {
                    this.formData = {};
                    // Initialise les champs vides pour éviter les bugs de liaison Alpine
                    this.formulairesConfig[this.activeTable].forEach(c => {
                        this.formData[c.name] = c.type === 'BOOLEAN' ? 'false' : '';
                    });
                },

                async loadData() {
                    if (!this.activeTable) return;
                    try {
                        const res = await fetch(`http://127.0.0.1:8001/api/v1/${this.activeTable}`);
                        if (res.ok) {
                            this.tableData = await res.json();
                        }
                    } catch (err) {
                        console.error("Erreur de chargement des données", err);
                    }
                },

                async submitForm() {
                    // Formatage des types avant envoi à l'API
                    const payload = {};
                    this.formulairesConfig[this.activeTable].forEach(c => {
                        let val = this.formData[c.name];
                        if (c.type === 'INTEGER') val = parseInt(val) || 0;
                        if (c.type === 'FLOAT') val = parseFloat(val) || 0.0;
                        if (c.type === 'BOOLEAN') val = (val === 'true' || val === true);
                        payload[c.name] = val;
                    });

                    try {
                        const res = await fetch(`http://127.0.0.1:8001/api/v1/${this.activeTable}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (res.ok) {
                            this.resetFormData();
                            this.loadData();
                        } else {
                            const errData = await res.json();
                            alert("Erreur de validation API : " + JSON.stringify(errData.detail));
                        }
                    } catch (err) {
                        alert("Impossible de contacter le serveur backend.");
                    }
                }
            }
        }
    </script>
</body>
</html>
