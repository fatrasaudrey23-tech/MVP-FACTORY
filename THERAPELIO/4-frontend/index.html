<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thérapelio — Santé mentale au travail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;600;700&family=Rethink+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        thera: {
                            energie: '#d2702e',
                            stabilite: '#283252',
                            confiance: '#F8F4E6',
                            optimisme: '#f5d410',
                            technologie: '#F23457',
                            reflexion: '#323d8b',
                            chaleur: '#e4a740'
                        }
                    },
                    fontFamily: {
                        sans: ['"Rethink Sans"', 'sans-serif'],
                        serif: ['"Fraunces"', 'serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-thera-confiance text-thera-stabilite font-sans h-screen flex overflow-hidden">

    <!-- OVERLAY MOBILE (derrière le menu latéral en version téléphone) -->
    <div id="sidebar-overlay" onclick="toggleSidebar(true)" class="fixed inset-0 bg-black/40 z-20 hidden md:hidden"></div>

    <!-- MENU LATÉRAL -->
    <aside id="sidebar" class="w-72 bg-white border-r border-thera-stabilite/5 shadow-sm flex flex-col z-30 justify-between shrink-0 fixed md:static inset-y-0 left-0 -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <div class="p-8 pb-4">
            <!-- Logo -->
            <img src="logo-principal_web.png" alt="Logo Thérapelio" class="w-56 mb-4 object-contain">

            <nav class="mt-6 space-y-2">
                <button id="nav-conversations" onclick="loadView('conversations')" class="w-full text-left px-4 py-3 rounded-xl bg-thera-confiance text-thera-energie font-semibold shadow-sm transition-all flex items-center gap-3">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    Discuter avec Thera
                </button>
                <button id="nav-praticiens" onclick="loadView('praticiens')" class="w-full text-left px-4 py-3 rounded-xl text-thera-stabilite/70 hover:bg-thera-confiance font-medium transition-all flex items-center gap-3">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    Prendre RDV
                </button>
                <button id="nav-ressources" onclick="loadView('ressources')" class="w-full text-left px-4 py-3 rounded-xl text-thera-stabilite/70 hover:bg-thera-confiance font-medium transition-all flex items-center gap-3">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    Boîte à outils
                </button>
                <button id="nav-bilans" onclick="loadView('bilans')" class="w-full text-left px-4 py-3 rounded-xl text-thera-stabilite/70 hover:bg-thera-confiance font-medium transition-all flex items-center gap-3">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    Mes Bilans
                </button>
            </nav>
        </div>

        <div class="p-4 mb-4">
            <button onclick="loadView('urgence')" class="w-full bg-white hover:bg-thera-technologie/5 border border-thera-technologie/20 hover:border-thera-technologie/40 px-4 py-3.5 rounded-xl transition-all flex items-center gap-3 text-left group">
                <div class="w-9 h-9 rounded-full bg-thera-technologie/10 group-hover:bg-thera-technologie/15 flex items-center justify-center shrink-0 transition-colors">
                    <svg class="w-4 h-4 text-thera-technologie" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                </div>
                <div class="min-w-0">
                    <p class="font-bold text-sm text-thera-technologie">Urgence</p>
                    <p class="text-xs text-thera-stabilite/50">Ligne d'écoute 3114 · Gratuit, 24h/24</p>
                </div>
            </button>
        </div>
    </aside>

    <!-- ZONE DE CONTENU PRINCIPALE -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden min-w-0">
        <header class="h-20 bg-thera-confiance/90 backdrop-blur-md flex items-center justify-between px-4 sm:px-10 border-b border-thera-stabilite/5 z-10 shrink-0">
            <div class="flex items-center gap-2 min-w-0">
                <button id="mobile-menu-btn" onclick="toggleSidebar()" class="md:hidden p-2 -ml-2 rounded-lg hover:bg-white/60 text-thera-stabilite shrink-0" aria-label="Ouvrir le menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h2 id="view-title" class="text-lg sm:text-2xl font-bold font-serif text-thera-stabilite truncate">Espace d'échange</h2>
            </div>
        </header>

        <div class="flex-1 p-3 sm:p-6 md:p-10 overflow-y-auto">
            <div id="content-area" class="max-w-4xl mx-auto bg-white p-4 sm:p-6 md:p-8 rounded-[2rem] shadow-sm border border-thera-stabilite/5 min-h-[550px] flex flex-col"></div>
        </div>
    </main>

    <!-- MODALE BOÎTE À OUTILS -->
    <div id="resource-modal-overlay" class="fixed inset-0 bg-black/50 z-40 hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] shadow-xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-6 sm:p-8 relative">
            <button onclick="fermerRessource()" class="absolute top-5 right-5 w-8 h-8 rounded-full bg-thera-confiance hover:bg-thera-stabilite/10 flex items-center justify-center text-thera-stabilite/60 hover:text-thera-stabilite transition-colors" aria-label="Fermer">✕</button>
            <div id="resource-modal-content"></div>
        </div>
    </div>

    <script>
const API_BASE = "https://therapelio-api.onrender.com"; // Serveur de Production
// const API_BASE = "http://127.0.0.1:8001"; // Serveur Local (Test)

        // Mémoire de conversation : générée à chaque chargement de page,
        // envoyée avec chaque message pour que l'IA garde le fil de l'échange.
        // (on évite crypto.randomUUID() : indisponible quand la page est ouverte en file://,
        // car ce n'est alors pas considéré comme un "contexte sécurisé" par le navigateur)
        function genererSessionId() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const sessionId = genererSessionId();
        let historique = [];

        // Échappe le HTML avant injection dans le DOM (évite l'injection de script
        // via un message tapé par l'utilisateur ou renvoyé par l'IA).
        function echapperHtml(texte) {
            const div = document.createElement('div');
            div.textContent = texte ?? '';
            return div.innerHTML;
        }

        function formaterHeure() {
            return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        function toggleSidebar(forceClose) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const estOuvert = !sidebar.classList.contains('-translate-x-full');
            if (forceClose || estOuvert) {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            }
        }

        window.onload = () => afficherAccueil();

        // ---------------------------------------------------------
        // ACCUEIL : onboarding (prénom/poste, une seule fois) puis
        // choix entre discuter avec Thera ou prendre RDV directement.
        // ---------------------------------------------------------

        function resetNavActive() {
            ['nav-conversations', 'nav-praticiens', 'nav-ressources', 'nav-bilans'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.className = "w-full text-left px-4 py-3 rounded-xl text-thera-stabilite/70 hover:bg-thera-confiance font-medium transition-all flex items-center gap-3";
            });
        }

        function afficherAccueil() {
            const userId = localStorage.getItem('therapelio_user_id');
            const prenom = localStorage.getItem('therapelio_prenom');
            if (!userId || !prenom) {
                afficherOnboarding();
                return;
            }

            resetNavActive();
            document.getElementById('view-title').innerText = "Bienvenue";
            document.getElementById('content-area').innerHTML = `
                <div class="flex flex-col items-center justify-center flex-1 text-center p-4 sm:p-6">
                    <h2 class="text-2xl font-bold font-serif text-thera-stabilite mb-2">Bonjour ${echapperHtml(prenom)} 👋</h2>
                    <p class="text-thera-stabilite/70 mb-10">Comment veux-tu commencer aujourd'hui ?</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 w-full max-w-xl">
                        <button onclick="loadView('conversations')" class="bg-white border-2 border-thera-stabilite/10 hover:border-thera-energie rounded-2xl p-6 text-left transition-all">
                            <div class="text-3xl mb-3">💬</div>
                            <h3 class="font-bold text-lg text-thera-stabilite mb-1">Discuter avec Thera</h3>
                            <p class="text-sm text-thera-stabilite/60">Un espace pour poser des mots sur ce que tu vis, à ton rythme.</p>
                        </button>
                        <button onclick="loadView('praticiens')" class="bg-white border-2 border-thera-stabilite/10 hover:border-thera-energie rounded-2xl p-6 text-left transition-all">
                            <div class="text-3xl mb-3">📅</div>
                            <h3 class="font-bold text-lg text-thera-stabilite mb-1">Prendre rendez-vous</h3>
                            <p class="text-sm text-thera-stabilite/60">Passe directement à un échange avec un professionnel, sous 72h.</p>
                        </button>
                    </div>
                    <button onclick="reinitialiserProfil()" class="text-xs text-thera-stabilite/40 hover:text-thera-stabilite/70 underline mt-8">Ce n'est pas toi ? Changer de profil</button>
                </div>`;
        }

        function afficherOnboarding() {
            resetNavActive();
            document.getElementById('view-title').innerText = "Bienvenue";
            document.getElementById('content-area').innerHTML = `
                <div class="flex flex-col items-center justify-center flex-1 text-center p-4 sm:p-6">
                    <div class="w-16 h-16 bg-thera-confiance rounded-full flex items-center justify-center text-3xl mb-5">👋</div>
                    <h2 class="text-2xl font-bold font-serif text-thera-stabilite mb-2">Bienvenue sur Thérapelio</h2>
                    <p class="text-thera-stabilite/70 mb-8 max-w-sm">Je suis Thera, ton assistant IA pour ta santé mentale au travail. Ton entreprise t'a fourni un code d'accès — entre-le pour créer ton profil.</p>
                    <div class="w-full max-w-sm space-y-3">
                        <input type="text" id="onboarding-code" placeholder="Code entreprise" maxlength="30" class="w-full p-3.5 rounded-xl border border-thera-stabilite/10 text-sm focus:outline-none focus:border-thera-energie">
                        <input type="text" id="onboarding-prenom" placeholder="Ton prénom" maxlength="40" class="w-full p-3.5 rounded-xl border border-thera-stabilite/10 text-sm focus:outline-none focus:border-thera-energie">
                        <input type="text" id="onboarding-poste" placeholder="Ton poste (optionnel)" maxlength="60" class="w-full p-3.5 rounded-xl border border-thera-stabilite/10 text-sm focus:outline-none focus:border-thera-energie" onkeydown="if(event.key==='Enter') terminerOnboarding()">
                        <button id="onboarding-btn" onclick="terminerOnboarding()" class="w-full bg-thera-energie hover:bg-[#c26224] text-white py-3.5 rounded-xl font-semibold shadow-md transition-all disabled:opacity-50">Continuer</button>
                    </div>
                    <p id="onboarding-erreur" class="text-xs text-thera-technologie mt-3 hidden"></p>
                    <p class="text-xs text-thera-stabilite/40 mt-5 max-w-sm">Aucune information personnelle (email, nom de famille) n'est demandée : ton profil reste pseudonyme.</p>
                    <button onclick="afficherRecuperation()" class="text-xs text-thera-stabilite/50 hover:text-thera-stabilite underline mt-4">J'ai déjà un profil</button>
                </div>`;
            document.getElementById('onboarding-code').focus();
        }

        async function terminerOnboarding() {
            const codeInput = document.getElementById('onboarding-code');
            const prenomInput = document.getElementById('onboarding-prenom');
            const code = codeInput.value.trim();
            const prenom = prenomInput.value.trim();
            const poste = document.getElementById('onboarding-poste').value.trim();
            const erreurEl = document.getElementById('onboarding-erreur');
            erreurEl.classList.add('hidden');

            if (!code) { codeInput.focus(); return; }
            if (!prenom) { prenomInput.focus(); return; }

            const btn = document.getElementById('onboarding-btn');
            btn.disabled = true;
            btn.innerText = "Un instant...";

            try {
                const response = await fetch(`${API_BASE}/v1/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ registration_code: code, prenom: prenom, poste: poste })
                });
                const result = await response.json();

                if (!response.ok) {
                    erreurEl.innerText = result.detail || "Code entreprise invalide.";
                    erreurEl.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerText = "Continuer";
                    return;
                }

                localStorage.setItem('therapelio_user_id', result.user_id);
                localStorage.setItem('therapelio_prenom', prenom);
                localStorage.setItem('therapelio_poste', poste);
                afficherCodeRecuperation(result.recovery_code, prenom);
            } catch (e) {
                erreurEl.innerText = "Erreur réseau, réessaie.";
                erreurEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Continuer";
            }
        }

        function afficherCodeRecuperation(code, prenom) {
            resetNavActive();
            document.getElementById('view-title').innerText = "Bienvenue";
            document.getElementById('content-area').innerHTML = `
                <div class="flex flex-col items-center justify-center flex-1 text-center p-4 sm:p-6">
                    <div class="w-16 h-16 bg-thera-confiance rounded-full flex items-center justify-center text-3xl mb-5">🔑</div>
                    <h2 class="text-2xl font-bold font-serif text-thera-stabilite mb-2">C'est fait, ${echapperHtml(prenom)} !</h2>
                    <p class="text-thera-stabilite/70 mb-6 max-w-sm">Voici ton code personnel. Note-le quelque part : il te permettra de retrouver ton profil si tu changes d'appareil ou de navigateur. Il ne sera plus jamais réaffiché.</p>
                    <div class="bg-thera-confiance/60 border-2 border-dashed border-thera-energie/40 rounded-2xl px-8 py-5 mb-6">
                        <span class="text-2xl font-bold font-mono tracking-widest text-thera-energie">${echapperHtml(code)}</span>
                    </div>
                    <button onclick="afficherAccueil()" class="w-full max-w-sm bg-thera-energie hover:bg-[#c26224] text-white py-3.5 rounded-xl font-semibold shadow-md transition-all">J'ai noté mon code, continuer</button>
                </div>`;
        }

        function afficherRecuperation() {
            resetNavActive();
            document.getElementById('view-title').innerText = "Bienvenue";
            document.getElementById('content-area').innerHTML = `
                <div class="flex flex-col items-center justify-center flex-1 text-center p-4 sm:p-6">
                    <div class="w-16 h-16 bg-thera-confiance rounded-full flex items-center justify-center text-3xl mb-5">🔑</div>
                    <h2 class="text-2xl font-bold font-serif text-thera-stabilite mb-2">Retrouver mon profil</h2>
                    <p class="text-thera-stabilite/70 mb-8 max-w-sm">Entre le code personnel que tu as reçu lors de ta première connexion.</p>
                    <div class="w-full max-w-sm space-y-3">
                        <input type="text" id="recuperation-code" placeholder="Code personnel" maxlength="10" class="w-full p-3.5 rounded-xl border border-thera-stabilite/10 text-sm text-center font-mono tracking-widest uppercase focus:outline-none focus:border-thera-energie" onkeydown="if(event.key==='Enter') validerRecuperation()">
                        <button id="recuperation-btn" onclick="validerRecuperation()" class="w-full bg-thera-energie hover:bg-[#c26224] text-white py-3.5 rounded-xl font-semibold shadow-md transition-all disabled:opacity-50">Retrouver mon profil</button>
                    </div>
                    <p id="recuperation-erreur" class="text-xs text-thera-technologie mt-3 hidden"></p>
                    <button onclick="afficherOnboarding()" class="text-xs text-thera-stabilite/50 hover:text-thera-stabilite underline mt-6">Je n'ai pas encore de profil</button>
                </div>`;
            document.getElementById('recuperation-code').focus();
        }

        async function validerRecuperation() {
            const codeInput = document.getElementById('recuperation-code');
            const code = codeInput.value.trim();
            const erreurEl = document.getElementById('recuperation-erreur');
            erreurEl.classList.add('hidden');
            if (!code) { codeInput.focus(); return; }

            const btn = document.getElementById('recuperation-btn');
            btn.disabled = true;
            btn.innerText = "Un instant...";

            try {
                const response = await fetch(`${API_BASE}/v1/auth/recover`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recovery_code: code })
                });
                const result = await response.json();

                if (!response.ok) {
                    erreurEl.innerText = result.detail || "Code introuvable.";
                    erreurEl.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerText = "Retrouver mon profil";
                    return;
                }

                localStorage.setItem('therapelio_user_id', result.user_id);
                localStorage.setItem('therapelio_prenom', result.prenom);
                localStorage.setItem('therapelio_poste', result.poste);
                afficherAccueil();
            } catch (e) {
                erreurEl.innerText = "Erreur réseau, réessaie.";
                erreurEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Retrouver mon profil";
            }
        }

        function reinitialiserProfil() {
            localStorage.removeItem('therapelio_user_id');
            localStorage.removeItem('therapelio_prenom');
            localStorage.removeItem('therapelio_poste');
            afficherOnboarding();
        }

        function loadView(view) {
            toggleSidebar(true); // referme le menu mobile après un clic de navigation
            const area = document.getElementById('content-area');
            const title = document.getElementById('view-title');
            const navIds = ['nav-conversations', 'nav-praticiens', 'nav-ressources', 'nav-bilans'];

            navIds.forEach(id => {
                const el = document.getElementById(id);
                if(el) el.className = "w-full text-left px-4 py-3 rounded-xl text-thera-stabilite/70 hover:bg-thera-confiance font-medium transition-all flex items-center gap-3";
            });

            if (view !== 'urgence') {
                const activeBtn = document.getElementById(`nav-${view}`);
                if (activeBtn) activeBtn.className = "w-full text-left px-4 py-3 rounded-xl bg-thera-confiance text-thera-energie font-semibold shadow-sm transition-all flex items-center gap-3";
            }

            if (view === 'conversations') {
                title.innerText = "Thera";
                const prenom = localStorage.getItem('therapelio_prenom') || '';
                area.innerHTML = `
                    <div class="flex flex-col h-[calc(100vh-220px)] min-h-[450px]">
                        <div id="chat-history" class="flex-1 overflow-y-auto px-2 py-4 space-y-5 scroll-smooth">
                            <div class="flex flex-col items-start gap-1">
                                <div class="flex justify-start items-start gap-3">
                                    <div class="w-9 h-9 rounded-full bg-thera-stabilite text-white flex items-center justify-center font-bold text-sm shrink-0 shadow-sm">T</div>
                                    <div class="bg-thera-confiance text-thera-stabilite p-4 rounded-2xl rounded-tl-none shadow-sm text-sm border border-thera-stabilite/5 leading-relaxed">
                                        <p class="font-bold mb-1">${prenom ? `Bonjour ${echapperHtml(prenom)} 👋` : 'Bonjour 👋'}</p>
                                        <p>Je suis Thera, ton assistant IA pour ta santé mentale au travail. En quoi puis-je t'accompagner aujourd'hui ?</p>
                                    </div>
                                </div>
                                <span class="text-[10px] text-thera-stabilite/40 pl-12">${formaterHeure()}</span>
                            </div>
                        </div>

                        <div class="mt-4 pt-4 border-t border-thera-stabilite/10 px-2 flex gap-3 items-end">
                            <textarea id="chat-input" rows="1" oninput="autoResizeTextarea(this)" class="flex-1 bg-thera-confiance/40 border border-thera-stabilite/10 p-3.5 rounded-xl focus:outline-none focus:border-thera-energie focus:bg-white transition-all text-sm resize-none max-h-36" placeholder="Écrivez votre message..." onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); envoyerMessage(); }"></textarea>
                            <button id="chat-send-btn" onclick="envoyerMessage()" class="bg-thera-energie hover:bg-[#c26224] text-white px-6 py-3.5 rounded-xl font-semibold shadow-md hover:-translate-y-0.5 transition-all text-sm shrink-0 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0">Envoyer</button>
                        </div>

        async function chargerDispos(eventTypeId, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="text-thera-energie animate-pulse text-center py-4 font-medium">Recherche des créneaux en cours...</div>`;

                const result = await response.json();
                if (response.ok && result.data && result.data.slots) {
                    const slotsData = result.data.slots;
                    const dates = Object.keys(slotsData);
                    if (dates.length === 0) return container.innerHTML = `<div class="text-center py-4 text-thera-stabilite/70">Aucune disponibilité sur les prochains jours.</div>`;

                    let slotsHtml = '<div class="grid grid-cols-2 gap-2 mt-3 max-h-60 overflow-y-auto p-1">';
                    for (const date of dates) {
                        for (const slot of slotsData[date]) {

                            const day = new Date(slot.time).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' });
                            slotsHtml += `<button onclick="reserver('${slot.time}', ${eventTypeId})" class="py-2.5 px-3 bg-thera-confiance border border-thera-stabilite/10 rounded-xl hover:border-thera-energie hover:bg-white transition text-xs font-bold text-thera-stabilite flex items-center justify-between"><span>${day}</span> <span class="text-thera-energie font-extrabold">${time}</span></button>`;

                    container.innerHTML = slotsHtml + '</div>';
                } else { container.innerHTML = `<div class="text-red-500 text-xs text-center mt-2 font-medium">Erreur lors de la lecture des créneaux.</div>`; }
            } catch (err) { container.innerHTML = `<div class="text-red-500 text-xs text-center mt-2 font-medium">Erreur de connexion au serveur de réservation.</div>`; }
        }

        async function envoyerMessage() {
            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('chat-send-btn');
            const message = input.value.trim();
            if (!message) return;
            const history = document.getElementById('chat-history');

            history.innerHTML += `
                <div class="flex flex-col items-end gap-1">
                    <div class="flex justify-end items-end gap-2">
                        <div class="bg-thera-stabilite text-white p-4 rounded-2xl rounded-tr-none max-w-[80%] shadow-sm text-sm leading-relaxed">${echapperHtml(message).replace(/\n/g, '<br>')}</div>
                    </div>
                    <span class="text-[10px] text-thera-stabilite/40 pr-1">${formaterHeure()}</span>
                </div>`;
            input.value = '';
            input.style.height = 'auto';
            input.disabled = true;
            sendBtn.disabled = true;
            history.scrollTop = history.scrollHeight;

            // On envoie l'historique précédent (sans le message courant) : le backend l'utilise
            // comme contexte de conversation et attend le nouveau message séparément.
            const historiqueEnvoye = [...historique];
            historique.push({ role: 'user', content: message });

            const typingId = 'typing-' + Date.now();
            history.innerHTML += `
                <div id="${typingId}" class="flex justify-start items-start gap-3">
                    <div class="w-9 h-9 rounded-full bg-thera-stabilite text-white flex items-center justify-center font-bold text-sm shrink-0 shadow-sm">T</div>
                    <div class="bg-thera-confiance p-4 rounded-2xl rounded-tl-none shadow-sm border border-thera-stabilite/5 flex gap-1.5 items-center">
                        <span class="w-2 h-2 bg-thera-stabilite/40 rounded-full animate-bounce" style="animation-delay:0ms"></span>
                        <span class="w-2 h-2 bg-thera-stabilite/40 rounded-full animate-bounce" style="animation-delay:150ms"></span>
                        <span class="w-2 h-2 bg-thera-stabilite/40 rounded-full animate-bounce" style="animation-delay:300ms"></span>
                    </div>
                </div>`;
            history.scrollTop = history.scrollHeight;

            try {
                const response = await fetch(`${API_BASE}/v1/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId,
                        history: historiqueEnvoye,
                        user_id: localStorage.getItem('therapelio_user_id') || '',
                        prenom: localStorage.getItem('therapelio_prenom') || '',
                        poste: localStorage.getItem('therapelio_poste') || ''
                    })
                });
                const result = await response.json();
                const isError = result.status === "error";

                if (!isError) {
                    historique.push({ role: 'assistant', content: result.reply });
                }

                document.getElementById(typingId)?.remove();
                history.innerHTML += `
                    <div class="flex flex-col items-start gap-1">
                        <div class="flex justify-start items-start gap-3">
                            <div class="w-9 h-9 rounded-full ${isError ? 'bg-thera-technologie' : 'bg-thera-stabilite'} text-white flex items-center justify-center font-bold text-sm shrink-0 shadow-sm">T</div>
                            <div class="${isError ? 'bg-red-50 text-thera-technologie border border-thera-technologie/20' : 'bg-thera-confiance text-thera-stabilite border border-thera-stabilite/5'} p-4 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm text-sm leading-relaxed">${echapperHtml(result.reply).replace(/\n/g, '<br>')}</div>
                        </div>
                        <span class="text-[10px] text-thera-stabilite/40 pl-12">${formaterHeure()}</span>
                    </div>`;
            } catch (err) {
                document.getElementById(typingId)?.remove();
                history.innerHTML += `<div class="text-red-500 text-xs text-center py-2 bg-red-50 rounded-xl border border-red-100">Impossible de joindre l'assistant (Erreur réseau).</div>`;
            }
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
            history.scrollTop = history.scrollHeight;
        }

        // --- Exercice de respiration (cercle animé) ---
        let respirationTimer = null;
        let respirationCycles = 0;
        let respirationEnCours = false;

        function demarrerRespiration() {
            if (respirationEnCours) return;
            respirationEnCours = true;
            respirationCycles = 0;
            const btn = document.getElementById('respiration-btn');
            if (btn) { btn.innerText = "Arrêter"; btn.onclick = arreterRespiration; }
            cycleRespiration();
        }

        function cycleRespiration() {
            const cercle = document.getElementById('respiration-cercle');
            const label = document.getElementById('respiration-label');
            if (!cercle || !label) { respirationEnCours = false; return; }

            cercle.style.transitionDuration = '4000ms';
            cercle.style.transform = 'scale(1.6)';
            label.innerText = 'Inspire...';

            respirationTimer = setTimeout(() => {
                const cercle2 = document.getElementById('respiration-cercle');
                const label2 = document.getElementById('respiration-label');
                if (!cercle2 || !label2) { respirationEnCours = false; return; }

                cercle2.style.transitionDuration = '6000ms';
                cercle2.style.transform = 'scale(1)';
                label2.innerText = 'Expire...';

                respirationTimer = setTimeout(() => {
                    respirationCycles++;
                    const compteur = document.getElementById('respiration-cycles');
                    if (compteur) compteur.innerText = respirationCycles;
                    if (respirationEnCours) cycleRespiration();
                }, 6000);
            }, 4000);
        }

        function arreterRespiration() {
            respirationEnCours = false;
            if (respirationTimer) { clearTimeout(respirationTimer); respirationTimer = null; }
            const label = document.getElementById('respiration-label');
            const cercle = document.getElementById('respiration-cercle');
            const btn = document.getElementById('respiration-btn');
            if (cercle) { cercle.style.transitionDuration = '600ms'; cercle.style.transform = 'scale(1)'; }
            if (label) label.innerText = 'Prêt ?';
            if (btn) { btn.innerText = 'Commencer'; btn.onclick = demarrerRespiration; }
        }

        const ARTICLE_DEFUSION = `
            <p>La défusion cognitive est un outil issu de la thérapie ACT (Acceptance and Commitment Therapy). L'idée : on n'a pas besoin de faire disparaître une pensée difficile pour aller mieux — on peut apprendre à prendre de la distance avec elle.</p>
            <p><strong class="text-thera-stabilite">Une pensée n'est pas un fait.</strong> "Je suis nul(le)" est une pensée qui passe dans ton esprit, pas une vérité sur qui tu es.</p>
            <p><strong class="text-thera-stabilite">Un exercice simple à essayer :</strong> quand une pensée difficile arrive, ajoute mentalement "Je remarque que j'ai la pensée que..." devant. "Je suis nul(le)" devient "Je remarque que j'ai la pensée que je suis nul(le)." Ça crée un petit espace entre toi et la pensée.</p>
            <p><strong class="text-thera-stabilite">Autre technique :</strong> répète le mot qui te dérange à voix haute, très vite, une trentaine de fois. Le mot perd souvent son sens et devient presque absurde — c'est le but.</p>
            <p class="text-thera-stabilite/60 text-xs pt-2">Ces exercices sont des outils de bien-être général, pas un traitement. Si une pensée revient souvent et pèse lourd, en parler avec un professionnel peut vraiment aider.</p>
        `;

        function afficherGuide(titre, description, etapes) {
            guideTitre = titre;
            guideDescription = description;
            guideEtapes = etapes;
            guideIndex = 0;
            renderGuideEtape();
        }

        function renderGuideEtape() {
            const content = document.getElementById('resource-modal-content');
            const estDerniere = guideIndex === guideEtapes.length - 1;
            content.innerHTML = `
                <h3 class="text-2xl font-bold font-serif text-thera-stabilite mb-1">${guideTitre}</h3>
                <p class="text-thera-stabilite/60 text-xs mb-6">${guideDescription}</p>
                <div class="bg-thera-confiance/40 rounded-2xl p-6 mb-6 min-h-[120px] flex items-center justify-center text-center">
                    <p class="text-thera-stabilite font-medium leading-relaxed">${guideEtapes[guideIndex]}</p>
                </div>
                <div class="flex items-center justify-between gap-3">
                    <button onclick="guideNaviguer(-1)" ${guideIndex === 0 ? 'disabled' : ''} class="text-thera-stabilite/70 hover:text-thera-stabilite text-sm font-semibold disabled:opacity-0 disabled:pointer-events-none transition-opacity">← Précédent</button>
                    <div class="flex gap-1.5">
                        ${guideEtapes.map((_, i) => `<span class="w-2 h-2 rounded-full ${i === guideIndex ? 'bg-thera-energie' : 'bg-thera-stabilite/15'}"></span>`).join('')}
                    </div>
                    ${estDerniere
                        ? `<button onclick="fermerRessource()" class="bg-thera-stabilite hover:bg-thera-reflexion text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition-all">Terminer</button>`
                        : `<button onclick="guideNaviguer(1)" class="bg-thera-energie hover:bg-[#c26224] text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition-all">Suivant →</button>`
                    }
                </div>`;
        }

        function guideNaviguer(delta) {
            guideIndex = Math.max(0, Math.min(guideEtapes.length - 1, guideIndex + delta));
            renderGuideEtape();
        }
    </script>
</body>
</html>
